<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medical Chatbot</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png"
      href="{{ url_for('static', filename='chbot.png') }}">

    <!-- Bootstrap -->
    <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
        crossorigin="anonymous">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://use.fontawesome.com/releases/v5.5.0/css/all.css"
        integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU"
        crossorigin="anonymous">

    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet"
        type="text/css"
        href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container-fluid h-100">
        <div class="row justify-content-center h-100">

            <div class="col-md-8 col-xl-6 chat">

                <div class="card">

                    <!-- Chat Header -->
                    <div class="card-header msg_head">

                        <div class="d-flex bd-highlight">

                            <div class="img_cont">

                                <img src="https://cdn-icons-png.flaticon.com/512/387/387569.png"
                                    class="rounded-circle user_img"
                                    alt="Medical Chatbot">

                                <span class="online_icon"></span>

                            </div>

                            <div class="user_info">

                                <span>Medical Chatbot</span>

                                <p>Ask me anything!</p>

                            </div>

                        </div>

                    </div>


                    <!-- Chat Messages -->
                    <div id="messageFormeight"
                        class="card-body msg_card_body">
                    </div>


                    <!-- Message Input -->
                    <div class="card-footer">

                        <form id="messageArea" class="input-group">

                            <input type="text"
                                id="text"
                                name="msg"
                                placeholder="Type your message..."
                                autocomplete="off"
                                class="form-control type_msg"
                                required />

                            <div class="input-group-append">

                                <button type="submit"
                                    id="send"
                                    class="input-group-text send_btn">

                                    <i class="fas fa-location-arrow"></i>

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>
    </div>


    <!-- Chat JavaScript -->
    <script>

        $(document).ready(function () {

            $("#messageArea").on("submit", function (event) {

                const date = new Date();

                const hour = date.getHours();
                const minute = date.getMinutes();

                const str_time = hour + ":" + minute;

                var rawText = $("#text").val();


                // User message
                var userHtml =
                    '<div class="d-flex justify-content-end mb-4">' +
                        '<div class="msg_cotainer_send">' +
                            rawText +
                            '<span class="msg_time_send">' +
                                str_time +
                            '</span>' +
                        '</div>' +

                        '<div class="img_cont_msg">' +
                            '<img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" ' +
                            'class="rounded-circle user_img_msg" ' +
                            'alt="User">' +
                        '</div>' +

                    '</div>';


                // Clear input
                $("#text").val("");


                // Display user message
                $("#messageFormeight").append(userHtml);


                // Send message to Flask backend
                $.ajax({

                    data: {
                        msg: rawText
                    },

                    type: "POST",

                    url: "/get"

                }).done(function (data) {

                    // Bot message
                    var botHtml =
                        '<div class="d-flex justify-content-start mb-4">' +

                            '<div class="img_cont_msg">' +
                                '<img src="https://cdn-icons-png.flaticon.com/512/387/387569.png" ' +
                                'class="rounded-circle user_img_msg" ' +
                                'alt="Medical Chatbot">' +
                            '</div>' +

                            '<div class="msg_cotainer">' +
                                data +
                                '<span class="msg_time">' +
                                    str_time +
                                '</span>' +
                            '</div>' +

                        '</div>';


                    // Display bot response
                    $("#messageFormeight").append(
                        $.parseHTML(botHtml)
                    );

                    // Scroll to latest message
                    $("#messageFormeight").scrollTop(
                        $("#messageFormeight")[0].scrollHeight
                    );

                });


                event.preventDefault();

            });

        });

    </script>

</body>

</html>
